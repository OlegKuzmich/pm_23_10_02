<section class="section-block-contact">

    <header>
        <div class="ribbon-bg-sidebar"></div>
        <div class="arrow_n_h">

            <h3 class="contact-info">CONTACT INFO</h3>

            <button (click)="openArrow()"><i class="arrow fa-solid fa-angle-down"></i></button>

        </div>
    </header>  

    <div class="contact-info-body">
        <h6 class="phone">PHONE</h6>
        <p>+000 123 456 789</p>

        <h6 class="email">EMAIL</h6>
        <p>urname@gmail.com</p>

        <h6 class="area">AREA</h6>
        <p class="address">{{address}}</p>
    </div>

</section>
