<section class="section-block-expertise">

  <header>
    <h5 class="expertise">EXPERTISE</h5>
  </header>


  <div class="expertise-list">
    @for (item of expertise; track item.name) {
      <div class="expertise-item">
        <div class="circle" [style.--percent]="item.percent + '%'">
          <span [innerText]="item.name"></span>
        </div>
      </div>
    } @empty {
      <p>Навички ще завантажуються...</p>
    }
  </div>
</section>
